- name: Installa prerequisiti
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-docker
    state: present
    update_cache: true

- name: Crea cartella chiave GPG
  ansible.builtin.file:
    path: "{{ docker_key_dir }}"
    state: directory
    mode: '0755'

- name: Scarica la chiave GPG di Docker
  ansible.builtin.get_url:
    url: "{{ docker_key_url }}"
    dest: "{{ docker_key_dir }}/docker.asc"
    mode: '0644'

# To do 1 - Ho sostituito il modulo copy con il modulo template per poter usare un file jinja2 più leggibile e riutilizzabile soprattutto se il contenuto cresce o se hai condizionali/loop Jinja2.
- name: Aggiungi repository Docker
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'

- name: Installa pacchetti Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Assicura che Docker sia avviato e abilitato al boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true